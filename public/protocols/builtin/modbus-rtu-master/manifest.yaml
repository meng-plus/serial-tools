id: modbus-rtu-master
name: Modbus RTU 主站
description: 周期轮询读取 RTU 从站寄存器（CRC16-Modbus 校验），支持多设备、超时重试与离线标记、参数变更即时生效。
version: 1.0.0
apiVersion: 1
role: master
entry: main.js
channelTypes:
  - serial
capabilities:
  - send
  - storage
  - chart
ui:
  params:
    - key: poll
      label: 轮询表（设备 / 功能码 / 寄存器范围）
      group: 数据采集
      type: table
      columns:
        - { key: name, label: 名称, type: text, default: "" }
        - { key: addr, label: 从站地址, type: number, default: 1 }
        - { key: func, label: 功能码, type: number, default: 3 }
        - { key: start, label: 起始寄存器, type: number, default: 0 }
        - { key: count, label: 数量, type: number, default: 10 }
    - key: cycle_ms
      label: 轮询周期（0 停止轮询）
      group: 通讯行为
      type: number
      default: 500
      min: 0
      max: 60000
      step: 50
    - key: timeout_ms
      label: 响应超时
      group: 通讯行为
      type: number
      default: 300
      min: 50
      max: 5000
      step: 10
    - key: retry
      label: 超时重试次数
      group: 通讯行为
      type: number
      default: 2
      min: 0
      max: 10
    - key: byte_order
      label: 寄存器字节序
      group: 通讯行为
      type: select
      default: be
      options:
        - { value: be, label: 大端（高字节在前） }
        - { value: le, label: 小端（低字节在前） }
  actions:
    - id: read_all
      label: 立即读取一轮
    - id: clear_offline
      label: 清除离线标记
    - id: write_reg
      label: 写单寄存器
      params:
        - key: addr
          label: 从站地址
          type: number
          default: 1
        - key: reg
          label: 寄存器地址
          type: number
          default: 0
        - key: value
          label: 值
          type: number
          default: 0
  dashboard:
    - { id: d1, type: register_grid, row: 0, col: 0, w: 12, h: 8, title: 轮询寄存器, grid: { label: 轮询寄存器, paramKey: poll, valuePattern: "{name}_{addr}", editable: true, writeAction: write_reg, writeArgs: { addr: "{device}", reg: "{addr}", value: "{value}" } } }
