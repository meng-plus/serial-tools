[workspace]
resolver = "2"
members = [
    "crates/transport",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mengplus <chengmeng_2@outlook.com>"]
license = "MIT"
repository = "https://github.com/meng-plus/serial-tools.git"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
hex = "0.4"
serialport = "4"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.10", features = ["native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

transport = { path = "crates/transport" }

[profile.release]
lto = true
codegen-units = 1
strip = true
